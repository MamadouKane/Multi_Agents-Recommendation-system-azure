<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="820" fill="#f3f3f3"/>

  <!-- Firebase -->
  <circle cx="70" cy="90" r="10" fill="#ffb703"/>
  <text x="90" y="96" font-size="20" fill="#222">Firebase</text>
  <rect x="40" y="130" width="150" height="60" rx="10" fill="#fff" stroke="#333"/>
  <text x="115" y="165" font-size="15" text-anchor="middle" fill="#222">Mobile App</text>
  <line x1="70" y1="105" x2="70" y2="128" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="115" y1="190" x2="115" y2="330" stroke="#333" marker-end="url(#arrow)"/>

  <!-- User -->
  <rect x="40" y="345" width="150" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="115" y="385" font-size="16" text-anchor="middle" fill="#222">User</text>
  <line x1="190" y1="380" x2="272" y2="380" stroke="#333" marker-end="url(#arrow)"/>

  <!-- API Endpoint outer box -->
  <rect x="280" y="130" width="960" height="560" rx="18" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="315" cy="165" r="9" fill="#009485"/>
  <text x="335" y="171" font-size="20" fill="#222">API Endpoint (FastAPI + Uvicorn)</text>

  <!-- Agent coordinator inner box -->
  <rect x="310" y="200" width="880" height="460" rx="16" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="335" y="230" font-size="16" fill="#555">Agent coordinator</text>

  <!-- Guard Agent -->
  <rect x="350" y="350" width="140" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="380" font-size="15" text-anchor="middle" fill="#222">Guard</text>
  <text x="420" y="400" font-size="15" text-anchor="middle" fill="#222">Agent</text>
  <line x1="272" y1="380" x2="348" y2="380" stroke="#333" marker-end="url(#arrow)"/>

  <!-- Safe question diamond -->
  <polygon points="620,320 720,385 620,450 520,385" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="380" font-size="13" text-anchor="middle" fill="#222">Safe</text>
  <text x="620" y="396" font-size="13" text-anchor="middle" fill="#222">question</text>
  <line x1="490" y1="385" x2="518" y2="385" stroke="#333" marker-end="url(#arrow)"/>

  <!-- Input Classifier Agent -->
  <rect x="770" y="350" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="855" y="380" font-size="15" text-anchor="middle" fill="#222">Input Classifier</text>
  <text x="855" y="400" font-size="15" text-anchor="middle" fill="#222">Agent</text>
  <text x="750" y="365" font-size="13" fill="#555">YES</text>
  <line x1="720" y1="385" x2="768" y2="385" stroke="#333" marker-end="url(#arrow)"/>

  <!-- NO branch to Response -->
  <text x="605" y="475" font-size="13" fill="#555">NO</text>
  <line x1="620" y1="450" x2="620" y2="710" stroke="#333"/>
  <line x1="620" y1="710" x2="838" y2="710" stroke="#333" marker-end="url(#arrow)"/>

  <!-- Order / Recommendation / Details agents -->
  <rect x="1040" y="250" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1125" y="290" font-size="15" text-anchor="middle" fill="#222">Order Agent</text>

  <rect x="1040" y="350" width="170" height="90" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1125" y="388" font-size="15" text-anchor="middle" fill="#222">Recommendation</text>
  <text x="1125" y="406" font-size="15" text-anchor="middle" fill="#222">Agent</text>

  <rect x="1040" y="470" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1125" y="510" font-size="15" text-anchor="middle" fill="#222">Details Agent</text>

  <line x1="940" y1="370" x2="1038" y2="290" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="940" y1="385" x2="1038" y2="395" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="940" y1="400" x2="1038" y2="500" stroke="#333" marker-end="url(#arrow)"/>

  <!-- funnel down to Response -->
  <line x1="1125" y1="320" x2="1125" y2="560" stroke="#333"/>
  <line x1="1125" y1="440" x2="1125" y2="560" stroke="#333"/>
  <line x1="1125" y1="540" x2="1125" y2="560" stroke="#333"/>
  <line x1="1125" y1="560" x2="1125" y2="600" stroke="#333"/>
  <rect x="900" y="670" width="160" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="980" y="705" font-size="15" text-anchor="middle" fill="#222">Response</text>
  <line x1="1125" y1="600" x2="1000" y2="668" stroke="#333" marker-end="url(#arrow)"/>

  <!-- Response back to user -->
  <line x1="900" y1="700" x2="115" y2="700" stroke="#333"/>
  <line x1="115" y1="700" x2="115" y2="417" stroke="#333" marker-end="url(#arrow)"/>

  <!-- OpenAI box -->
  <rect x="1290" y="130" width="180" height="80" rx="12" fill="#fff" stroke="#10a37f" stroke-width="2"/>
  <circle cx="1315" cy="160" r="9" fill="#10a37f"/>
  <text x="1335" y="165" font-size="14" fill="#222">OpenAI</text>
  <text x="1380" y="185" font-size="12" text-anchor="middle" fill="#555">gpt-4o-mini</text>

  <!-- OpenAI fan-out to agents (chat completions) -->
  <path d="M1290,160 C 1000,60 500,60 420,348" fill="none" stroke="#10a37f" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M1290,165 C 1050,90 900,120 855,348" fill="none" stroke="#10a37f" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M1290,175 C 1250,220 1200,240 1212,250" fill="none" stroke="#10a37f" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M1290,190 C 1250,300 1230,340 1212,360" fill="none" stroke="#10a37f" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M1290,200 C 1260,380 1230,460 1212,480" fill="none" stroke="#10a37f" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Trained Recommendation -->
  <rect x="1290" y="360" width="180" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1380" y="390" font-size="14" text-anchor="middle" fill="#222">Trained</text>
  <text x="1380" y="408" font-size="14" text-anchor="middle" fill="#222">Recommendation</text>
  <line x1="1288" y1="400" x2="1212" y2="395" stroke="#333" marker-end="url(#arrow)"/>

  <!-- Vector database / Pinecone -->
  <rect x="1290" y="480" width="180" height="80" rx="10" fill="#fff" stroke="#7c4dff" stroke-width="1.5"/>
  <text x="1380" y="508" font-size="14" text-anchor="middle" fill="#222">Vector database</text>
  <text x="1380" y="526" font-size="12" text-anchor="middle" fill="#555">(Pinecone)</text>
  <text x="1380" y="544" font-size="11" text-anchor="middle" fill="#777">OpenAI embeddings, 1536-dim</text>
  <line x1="1288" y1="510" x2="1212" y2="505" stroke="#333" marker-end="url(#arrow)"/>

  <text x="750" y="790" font-size="13" text-anchor="middle" fill="#777">Coffee Shop Chatbot — Agent Architecture (OpenAI + FastAPI)</text>
</svg>
