<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry's Way assistant</title>
<style>
  :root {
    --bg: #f6f1ea; --panel: #ffffff; --ink: #2b211b; --muted: #7a6a5d; --line: #e6dbcf;
    --brand: #8a4b2a; --brand-ink: #ffffff; --user: #8a4b2a; --user-ink: #ffffff;
    --bot: #f1e8de; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1613; --panel: #241d19; --ink: #f1e7dd; --muted: #b3a294; --line: #3a2f28;
      --brand: #c98a5e; --brand-ink: #1b1613; --user: #c98a5e; --user-ink: #1b1613;
      --bot: #2f2621; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  /* Two panels side by side; stacked on narrow screens. */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 480px; gap: 16px;
    max-width: 1280px; margin: 0 auto; padding: 16px; height: calc(100vh - 74px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .bar button { background: transparent; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; }
  small.id { font-family: ui-monospace, monospace; font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }

  /* Chat */
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap;
    overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-ink); }
  .bot { align-self: flex-start; background: var(--bot); }
  .error { align-self: flex-start; color: var(--error); border: 1px solid var(--error); background: transparent; }
  .badge { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-bottom: 4px; }
  .typing { color: var(--muted); font-style: italic; }
  #examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  #examples button { border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  #examples button:hover { border-color: var(--brand); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; }
  button.primary { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }

  /* Menu: category shortcuts, then a scroller of sections with larger cards. */
  #categories { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #categories button { border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  #categories button:hover { border-color: var(--brand); color: var(--brand); }
  #menu { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 16px 16px;
    scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--brand) transparent; }
  #menu::-webkit-scrollbar { width: 8px; }
  #menu::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 8px; }
  #menu h3 { position: sticky; top: 0; z-index: 1; margin: 0; padding: 14px 0 8px; background: var(--panel);
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .product { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; cursor: pointer; background: transparent; color: var(--ink); padding: 0;
    text-align: left; font: inherit; transition: border-color .15s, transform .15s; }
  .product:hover { border-color: var(--brand); transform: translateY(-1px); }
  .product img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
    background: var(--bot); flex: none; }
  .product .caption { display: block; padding: 8px 10px 10px; }
  .product .name { display: block; font-weight: 600; font-size: 14px; line-height: 1.3; }
  .product .price { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }

  @media (max-width: 980px) {
    /* minmax(0, 1fr), not 1fr: a 1fr column never shrinks below its widest content. */
    main { grid-template-columns: minmax(0, 1fr); height: auto; padding: 12px; }
    #chat { height: 75vh; }
    #menu-panel { height: 80vh; }
  }
  @media (max-width: 420px) {
    .grid { gap: 8px; }
    .product .name { font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <h1>Merry's Way coffee assistant</h1>
  <p>Ask about the menu, allergens, hours or delivery; order; ask for a suggestion.</p>
</header>
<main>
  <section class="card" id="chat">
    <div class="bar">
      <small class="id" id="conversation">New conversation</small>
      <button type="button" id="reset">New conversation</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <div id="examples"></div>
    <form id="form">
      <input id="input" autocomplete="off" maxlength="2000" placeholder="I'd like a latte and a croissant" aria-label="Your message">
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
  <aside class="card" id="menu-panel">
    <div class="bar"><span>Menu</span><span>tap an item to ask about it</span></div>
    <nav id="categories" aria-label="Menu categories"></nav>
    <div id="menu"></div>
  </aside>
</main>
<script>
  // Everything the assistant returns is displayed as text (textContent), never as HTML.
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const conversationLabel = document.getElementById("conversation");
  const EXAMPLES = [
    "I'd like a latte and a croissant",
    "Is there any nut in the almond croissant?",
    "What time do you open on Sunday?",
    "What goes well with a cappuccino?",
    "Do you deliver to SoHo?",
  ];
  const WELCOME = [
    "Welcome to Merry's Way! I'm the café's assistant, happy to help you choose and order.",
    "",
    "Here is what I can do for you:",
    "• Take your order: just say what you'd like, for example \"a latte and a croissant\". " +
      "I keep your basket up to date and give you the exact total.",
    "• Answer your questions: ingredients, allergens, prices, opening hours and delivery areas.",
    "• Suggest something: what goes well with your order, or our customers' favourites.",
    "",
    "Tap any item in the menu to learn more about it, or pick one of the examples below. " +
      "What can I get for you today?",
  ].join("\n");
  let messages = [];       // the whole conversation, assistant memory included (stateless API)
  let conversationId = null;

  function bubble(kind, text, badge) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    if (badge) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = badge;
      div.appendChild(b);
      div.appendChild(document.createElement("br"));
    }
    div.appendChild(document.createTextNode(text));
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function ask(text) {
    text = text.trim();
    if (!text) return;
    bubble("user", text);
    messages.push({ role: "user", content: text });
    input.value = "";
    send.disabled = true;
    const typing = bubble("bot typing", "…");
    try {
      const body = { messages };
      if (conversationId) body.conversation_id = conversationId;
      const response = await fetch("/api/v1/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      typing.remove();
      if (!response.ok) {
        messages.pop();
        const detail = response.status === 503
          ? "The assistant is temporarily unavailable (the knowledge base may be paused). Try an order or a suggestion, or come back later."
          : "Something went wrong (" + response.status + ").";
        bubble("error", detail);
        return;
      }
      const data = await response.json();
      conversationId = data.conversation_id;
      conversationLabel.textContent = conversationId;
      messages.push(data.output);
      const label = data.agent === "guard" ? "refused" : data.agent;
      bubble("bot", data.output.content, label);
    } catch (error) {
      typing.remove();
      messages.pop();
      bubble("error", "Network error: " + error.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    ask(input.value);
  });
  document.getElementById("reset").addEventListener("click", () => {
    messages = [];
    conversationId = null;
    conversationLabel.textContent = "New conversation";
    log.replaceChildren();
    greet();
  });

  const examples = document.getElementById("examples");
  for (const text of EXAMPLES) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    button.addEventListener("click", () => ask(text));
    examples.appendChild(button);
  }

  function greet() {
    bubble("bot", WELCOME, "Merry's Way");
  }
  greet();

  // Pastries first: ten items fill the two columns, and they open the menu with its largest choice.
  const CATEGORY_ORDER = ["Bakery", "Coffee", "Drinking Chocolate", "Flavours"];
  const CATEGORY_TITLES = { "Coffee": "Coffee", "Drinking Chocolate": "Hot chocolate",
                            "Bakery": "Pastries", "Flavours": "Syrups" };

  function productCard(p) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "product";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = p.name;
    img.src = new URL(p.image_url).pathname;  // same origin, whatever scheme the API reported
    const caption = document.createElement("span");
    caption.className = "caption";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = p.name;
    const price = document.createElement("span");
    price.className = "price";
    price.textContent = p.price + " " + p.currency;
    caption.append(name, price);
    card.append(img, caption);
    card.addEventListener("click", () => { input.value = "Tell me about the " + p.name; input.focus(); });
    return card;
  }

  fetch("/api/v1/products").then((r) => r.json()).then((products) => {
    const menu = document.getElementById("menu");
    const nav = document.getElementById("categories");
    const categories = [...new Set(products.map((p) => p.category))]
      .sort((a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b));
    for (const category of categories) {
      const section = document.createElement("section");
      section.id = "category-" + category.toLowerCase().replace(/[^a-z]+/g, "-");
      const title = document.createElement("h3");
      title.textContent = CATEGORY_TITLES[category] || category;
      const grid = document.createElement("div");
      grid.className = "grid";
      for (const p of products.filter((x) => x.category === category)) grid.appendChild(productCard(p));
      section.append(title, grid);
      menu.appendChild(section);

      const chip = document.createElement("button");
      chip.type = "button";
      chip.textContent = title.textContent;
      chip.addEventListener("click", () => { menu.scrollTop = section.offsetTop - menu.offsetTop; });
      nav.appendChild(chip);
    }
  }).catch(() => {});
</script>
</body>
</html>
