$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: coffee_reco_evaluate
display_name: Sweep and evaluate
description: Sweeps min_support on validation, reports the chosen value on the test week against the popularity baseline.
version: 1
code: ..
environment: azureml://registries/azureml/environments/sklearn-1.5/labels/latest
inputs:
  baskets:
    type: uri_folder
  min_supports:
    type: string
    default: "0.005,0.01,0.02,0.03,0.05,0.08"
outputs:
  selection:
    type: uri_folder
command: >-
  python -m reco.sweep --baskets_dir ${{inputs.baskets}}
  --min_supports ${{inputs.min_supports}} --output_dir ${{outputs.selection}}
