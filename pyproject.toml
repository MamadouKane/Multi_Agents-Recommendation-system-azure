[project]
name = "coffee-shop-ai-azure"
version = "0.1.0"
description = "Multi-agent coffee shop assistant, productionised on Azure"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "openai>=1.50",
  "azure-identity>=1.19",
  "azure-search-documents>=11.5",
  "azure-cosmos>=4.7",
  "azure-storage-blob>=12.23",
  "azure-keyvault-secrets>=4.8",
  "azure-ai-contentsafety>=1.0",
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "tenacity>=9.0",
  "rapidfuzz>=3.10",
]

[project.optional-dependencies]
ml = ["pandas>=2.2", "numpy>=1.26", "mlxtend>=0.23", "mlflow>=2.17", "azure-ai-ml>=1.21", "pyarrow>=17.0"]
evals = ["azure-ai-evaluation>=1.0", "pandas>=2.2"]
dev = ["ruff>=0.7", "mypy>=1.13", "pytest>=8.3", "pytest-cov>=5.0", "pytest-asyncio>=0.24", "httpx>=0.27", "pre-commit>=4.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["^legacy/", "^notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires live Azure resources", "smoke: post-deployment checks"]

[tool.coverage.run]
source = ["src/api"]
omit = ["*/tests/*"]
